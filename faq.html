<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ | Stella (ステラ)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ヘッダー -->
    <header>
        <div class="logo"><a href="index.html">Stella (ステラ)</a></div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">トップ</a></li>
                <li><a href="recruit.html">募集要項</a></li>
                <li><a href="faq.html" class="active">FAQ</a></li>
                <li><a href="access.html">アクセス</a></li>
            </ul>
        </nav>
    </header>

    <!-- FAQ -->
    <section class="section">
        <h2 class="section-title">FAQ</h2>
        <p class="section-desc">よくあるご質問</p>

        <div class="faq-list">
            <div class="faq-item">
                <button class="faq-question" type="button">
                    <span>初心者ですが参加できますか？</span>
                    <span class="faq-icon">+</span>
                </button>
                <div class="faq-answer">
                    <p>もちろん大歓迎です。メンバーの半数以上が初心者・未経験からのスタートです。基本の打ち方から丁寧にサポートします。</p>
                </div>
            </div>
            <div class="faq-item">
                <button class="faq-question" type="button">
                    <span>ラケットを持っていません。</span>
                    <span class="faq-icon">+</span>
                </button>
                <div class="faq-answer">
                    <p>貸出用ラケットをご用意しています。まずは手ぶらでお越しいただいて大丈夫です。室内シューズと飲み物だけご持参ください。</p>
                </div>
            </div>
            <div class="faq-item">
                <button class="faq-question" type="button">
                    <span>体験だけの参加はできますか？</span>
                    <span class="faq-icon">+</span>
                </button>
                <div class="faq-answer">
                    <p>はい。初回は無料で体験いただけます。募集要項ページのお申し込みフォームからお気軽にご連絡ください。</p>
                </div>
            </div>
            <div class="faq-item">
                <button class="faq-question" type="button">
                    <span>途中参加・途中退出はできますか？</span>
                    <span class="faq-icon">+</span>
                </button>
                <div class="faq-answer">
                    <p>問題ありません。ご都合に合わせて、活動時間内で自由に参加・退出いただけます。</p>
                </div>
            </div>
        </div>
    </section>

    <!-- フッター -->
    <footer>
        <p>&copy; 2026 Stella (ステラ)</p>
    </footer>

    <script src="main.js"></script>
</body>
</html>
